spring:
  datasource:
    druid:
      url: jdbc:mysql://localhost:3306/abacus?useUnicode=true&characterEncoding=UTF-8&useSSL=false
      username: abacus
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000